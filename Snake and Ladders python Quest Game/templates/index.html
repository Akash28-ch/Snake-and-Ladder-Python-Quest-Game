<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Quest</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f7f1df;
            --surface-color: rgba(255, 250, 240, 0.86);
            --text-color: #2b2118;
            --muted-color: #6f6254;
            --border-color: #b98b49;
            --accent-color: #b87924;
            --accent-hover: #9d6419;
            --button-text: #fff8e7;
            --shadow-color: rgba(76, 48, 18, 0.24);
        }
        [data-theme="dark"] {
            --bg-color: #101820;
            --surface-color: rgba(24, 35, 45, 0.88);
            --text-color: #f3ead7;
            --muted-color: #c7b998;
            --border-color: #d0a34f;
            --accent-color: #f0b84f;
            --accent-hover: #ffd27a;
            --button-text: #1a1208;
            --shadow-color: rgba(0, 0, 0, 0.48);
        }
        body {
            background:
                linear-gradient(135deg, rgba(184,121,36,0.18), transparent 35%),
                linear-gradient(315deg, rgba(47,58,67,0.16), transparent 38%),
                var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            overflow: hidden;
            position: relative;
            transition: background-color 0.3s, color 0.3s;
        }
        .animated-bg {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }
        .bg-piece {
            position: absolute;
            opacity: 0.38;
            filter: saturate(1.35) brightness(1.12) drop-shadow(0 10px 14px var(--shadow-color));
            user-select: none;
        }
        [data-theme="dark"] .bg-piece {
            opacity: 0.18;
            filter: drop-shadow(0 10px 14px var(--shadow-color));
        }
        .bg-piece.snake {
            font-size: clamp(3rem, 8vw, 6.5rem);
            animation: snake-drift 14s ease-in-out infinite;
        }
        .bg-piece.ladder {
            font-size: clamp(3.2rem, 8vw, 7rem);
            animation: ladder-float 12s ease-in-out infinite;
        }
        .bg-piece:nth-child(1) { left: 7%; top: 12%; animation-delay: -1s; }
        .bg-piece:nth-child(2) { right: 8%; top: 16%; animation-delay: -4s; }
        .bg-piece:nth-child(3) { left: 14%; bottom: 10%; animation-delay: -7s; }
        .bg-piece:nth-child(4) { right: 18%; bottom: 7%; animation-delay: -2s; }
        .bg-piece:nth-child(5) { left: 45%; top: 4%; animation-delay: -9s; }
        .bg-piece:nth-child(6) { left: 58%; bottom: 15%; animation-delay: -5s; }
        @keyframes snake-drift {
            0%, 100% { transform: translate3d(0, 0, 0) rotate(-10deg) scale(1); }
            35% { transform: translate3d(18px, -26px, 0) rotate(8deg) scale(1.06); }
            70% { transform: translate3d(-16px, 18px, 0) rotate(-4deg) scale(0.96); }
        }
        @keyframes ladder-float {
            0%, 100% { transform: translateY(0) rotate(18deg); }
            50% { transform: translateY(-34px) rotate(25deg); }
        }
        .theme-toggle {
            position: fixed;
            top: 18px;
            right: 18px;
            z-index: 3;
            background: var(--accent-color);
            border: 1px solid var(--border-color);
            color: var(--button-text);
            border-radius: 8px;
            padding: 8px 14px;
            font-weight: 700;
            transition: transform 0.2s, background-color 0.2s, box-shadow 0.2s;
        }
        .theme-toggle:hover {
            background: var(--accent-hover);
            color: var(--button-text);
            transform: translateY(-2px);
            box-shadow: 0 8px 18px var(--shadow-color);
        }
        .hero-card {
            background: var(--surface-color);
            border: 2px solid var(--border-color);
            border-radius: 10px;
            padding: 3rem;
            box-shadow: 0 12px 34px var(--shadow-color);
            backdrop-filter: blur(10px);
        }
        .container { position: relative; z-index: 1; }
        .lead { color: var(--muted-color); }
        .btn-warning {
            background: var(--accent-color);
            border-color: var(--accent-color);
            color: var(--button-text);
            transition: transform 0.2s, background-color 0.2s, box-shadow 0.2s;
        }
        .btn-warning:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
            color: var(--button-text);
            transform: translateY(-2px);
            box-shadow: 0 10px 22px var(--shadow-color);
        }
    </style>
</head>
<body data-theme="light">
    <div class="animated-bg" aria-hidden="true">
        <span class="bg-piece snake">&#128013;</span>
        <span class="bg-piece ladder">&#129692;</span>
        <span class="bg-piece ladder">&#129692;</span>
        <span class="bg-piece snake">&#128013;</span>
        <span class="bg-piece snake">&#128013;</span>
        <span class="bg-piece ladder">&#129692;</span>
    </div>
    <button id="theme-toggle" class="theme-toggle" type="button" onclick="toggleTheme()">&#127769; Dark</button>
    <div class="container text-center">
        <div class="hero-card">
            <h1 class="display-3 fw-bold">Snake and Ladder Python Quest Game</h1>
            <p class="lead">Master Python while climbing ladders and dodging snakes!</p>
            <div class="mt-4">
                <a href="/setup" class="btn btn-warning btn-lg px-5 py-3 fw-bold">START GAME</a>
            </div>
        </div>
    </div>
    <script>
        function updateThemeButton() {
            const button = document.getElementById('theme-toggle');
            const isDark = document.body.getAttribute('data-theme') === 'dark';
            button.innerHTML = isDark ? '&#9728;&#65039; Light' : '&#127769; Dark';
        }

        function toggleTheme() {
            const nextTheme = document.body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.body.setAttribute('data-theme', nextTheme);
            localStorage.setItem('pythonQuestTheme', nextTheme);
            updateThemeButton();
        }

        document.body.setAttribute('data-theme', localStorage.getItem('pythonQuestTheme') || 'light');
        updateThemeButton();
    </script>
</body>
</html>
